<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover which notable historical figures were alive at the same time as a given person."
    />
    <title>Contemporaries – Who lived at the same time?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="header-inner">
          <a href="./" class="brand" id="brand-link">
            <span class="brand-mark" aria-hidden="true">⏳</span>
            <span class="brand-text">
              <span class="brand-title">Contemporaries</span>
              <span class="brand-tagline">Who lived at the same time?</span>
            </span>
          </a>
        </div>
      </header>

      <main class="main">
        <section class="search-section" id="search-section">
          <h1 class="search-heading">Find historical contemporaries</h1>
          <p class="search-sub">
            Type a name and see which notable people shared their lifetime.
          </p>
          <form class="search-form" id="search-form" autocomplete="off">
            <div class="search-box">
              <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                type="search"
                id="search-input"
                name="q"
                placeholder="e.g. Charles II of England, Marie Curie…"
                aria-label="Search for a historical figure"
                aria-autocomplete="list"
                aria-controls="search-results"
                aria-expanded="false"
              />
              <button type="submit" class="btn btn-primary" id="search-btn">
                Search
              </button>
            </div>
            <div
              id="search-results"
              class="search-results"
              role="listbox"
              hidden
            ></div>
          </form>
          <p class="search-hint" id="search-hint">
            Try <button type="button" class="link-btn" data-example="Charles II of England">Charles II of England</button>,
            <button type="button" class="link-btn" data-example="Leonardo da Vinci">Leonardo da Vinci</button>, or
            <button type="button" class="link-btn" data-example="Cleopatra">Cleopatra</button>
          </p>
        </section>

        <section class="status-section" id="status-section" hidden>
          <div class="status-card" id="status-card">
            <div class="spinner" aria-hidden="true"></div>
            <p class="status-message" id="status-message">Loading…</p>
          </div>
        </section>

        <section class="hero-section" id="hero-section" hidden></section>

        <section class="grid-section" id="grid-section" hidden>
          <div class="grid-header">
            <h2 class="grid-title" id="grid-title">Contemporaries</h2>
            <p class="grid-meta" id="grid-meta"></p>
          </div>
          <div class="card-grid" id="card-grid"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          Data from
          <a href="https://www.wikidata.org/" rel="noopener noreferrer" target="_blank">Wikidata</a>
          and
          <a href="https://www.wikipedia.org/" rel="noopener noreferrer" target="_blank">Wikipedia</a>.
          Lifetimes overlap if birth and death ranges intersect.
        </p>
      </footer>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
